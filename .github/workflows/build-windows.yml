name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: Download AutoDock Vina (Windows binary)
        run: |
          set -e
          mkdir -p docking/bin
          curl -L -o docking/bin/vina.exe https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.5/vina_1.2.5_windows_x86_64.exe

      - name: Build .exe with PyInstaller
        run: |
          set -e
          pyinstaller --noconfirm --onefile --windowed \
            --name VinaStudio \
            --paths src \
            --add-data "reference_data;reference_data" \
            --add-data "docking/receptor;docking/receptor" \
            --add-binary "docking/bin/vina.exe;docking/bin" \
            run_gui.py

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinaStudio-Windows
          path: dist/VinaStudio.exe
