name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: Diagnose Open Babel install location
        shell: pwsh
        run: |
          Write-Host "--- Recherche de obabel.exe sur le runner ---"
          $obabelPath = (Get-Command obabel -ErrorAction SilentlyContinue).Source
          Write-Host "obabel trouve via PATH : $obabelPath"

          Write-Host "--- Recherche large dans site-packages ---"
          $pyLib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Write-Host "site-packages : $pyLib"
          Get-ChildItem -Path $pyLib -Recurse -Include "obabel*.exe","*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "openbabel" } |
            ForEach-Object { Write-Host "EXE trouve : $($_.FullName)" }

          Write-Host "--- Recherche des dossiers de donnees (BABEL_DATADIR probable) ---"
          Get-ChildItem -Path $pyLib -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "openbabel|BABEL" } |
            ForEach-Object { Write-Host "Dossier trouve : $($_.FullName)" }

      - name: Download AutoDock Vina (Windows binary)
        run: |
          set -e
          mkdir -p docking/bin
          curl -L -f -o docking/bin/vina.exe https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.5/vina_1.2.5_win.exe

      - name: Verify Vina binary runs on this runner
        shell: pwsh
        run: |
          $size = (Get-Item docking/bin/vina.exe).Length
          Write-Host "Taille du fichier vina.exe : $size octets"
          if ($size -lt 100000) {
            Write-Error "Fichier vina.exe suspicieusement petit -- probablement un telechargement rate (page d'erreur au lieu du binaire)."
            exit 1
          }
          & .\docking\bin\vina.exe --help
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vina.exe ne s'execute pas correctement sur ce runner Windows x64 -- binaire incompatible ou corrompu."
            exit 1
          }

      - name: Build .exe with PyInstaller
        run: |
          set -e
          pyinstaller --noconfirm --onefile --windowed \
            --name VinaStudio \
            --paths src \
            --add-data "reference_data;reference_data" \
            --add-data "docking/receptor;docking/receptor" \
            --add-binary "docking/bin/vina.exe;docking/bin" \
            run_gui.py

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinaStudio-Windows
          path: dist/VinaStudio.exe
